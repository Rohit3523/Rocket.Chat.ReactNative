name: Run Maestro Tests on Android

on:
  pull_request:
    branches:
      - '*'

jobs:
  android-maestro-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: yarn install

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle Caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode Keystore
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore/release.keystore

      - name: Set gradle.properties
        run: |
          echo "KEYSTORE=android/keystore/release.keystore" >> android/gradle.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> android/gradle.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/gradle.properties

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleExperimentalRelease --no-daemon --build-cache --parallel --max-workers=4
          mv app/build/outputs/apk/experimental/release/app-experimental-release.apk app/app-experimental-release.apk
          ./gradlew clean

      - name: Start Android Emulator and Run Maestro Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          ram-size: 2048M
          disk-size: 4096M
          target: default
          script: |
            mkdir -p recording
            adb install app/app-experimental-release.apk
            maestro test .maestro --format junit --output maestro-report.xml

      - name: Generate HTML from JUnit XML
        run: |
          npm install -g junit-viewer
          junit-viewer --results=maestro-report.xml --save=report.html
      
      - name: Move Failed Test Recordings Only
        run: |
          mkdir -p failed_recordings
          while read -r line; do
            TEST_ID=$(echo "$line" | sed -n 's/.*id="\([^"]*\)".*/\1/p')
            FILE_ID=$(echo "$TEST_ID" | tr '[:upper:]' '[:lower:]' | sed 's/ /_/g')
            FILE_PATH="recording/${FILE_ID}.mp4"
            if [ -f "$FILE_PATH" ]; then
              mv "$FILE_PATH" "failed_recordings/${FILE_ID}.mp4"
            fi
          done < <(xmllint --xpath '//testcase[@status="ERROR"]' maestro-report.xml 2>/dev/null || true)

      - name: Upload Failed Test Recordings
        uses: actions/upload-artifact@v4
        with:
          name: Failed Test Recordings
          path: failed_recordings/

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: Android Test Report
          path: report.html

      - name: Comment Failed Test Videos on PR
        if: github.event_name == 'pull_request'
        run: |
          MESSAGE="### ❌ Failed Maestro Tests with Recordings\n"
          HAS_FAILURES=0

          while read -r line; do
            TEST_ID=$(echo "$line" | sed -n 's/.*id="\([^"]*\)".*/\1/p')
            FILE_ID=$(echo "$TEST_ID" | tr '[:upper:]' '[:lower:]' | sed 's/ /_/g')
            FILE_PATH="recording/${FILE_ID}.mp4"
            ARTIFACT_LINK="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            if [ -f "$FILE_PATH" ]; then
              HAS_FAILURES=1
              MESSAGE+="🔴 **$TEST_ID** - [🎥 Recording]($ARTIFACT_LINK)\n"
            fi
          done < <(xmllint --xpath '//testcase[@status="ERROR"]' maestro-report.xml 2>/dev/null || true)

          if [ "$HAS_FAILURES" -eq 1 ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body "$MESSAGE"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}