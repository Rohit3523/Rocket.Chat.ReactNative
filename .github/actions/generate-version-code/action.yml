name: Generate Version Code
description: Generates version code

outputs:
  VERSIONCODE:
    description: "Generated version code"
    value: ${{ steps.compute.outputs.VERSIONCODE }}

runs:
  using: "composite"
  steps:
    - name: Get VERSIONCODE from repo variable
      id: versioncode
      shell: bash
      run: |
        RESPONSE=$(curl -s -L \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ github.repository }}/actions/variables/VERSIONCODE)

        VALUE=$(echo "$RESPONSE" | jq -r '.value')
        echo "LATEST_VERSIONCODE=$VALUE" >> $GITHUB_OUTPUT

    - name: Compute VERSIONCODE
      id: compute
      shell: bash
      run: |
        LATEST_VERSIONCODE="${{ steps.versioncode.outputs.LATEST_VERSIONCODE }}"
        VERSIONCODE=$((LATEST_VERSIONCODE + 1))
        echo "VERSIONCODE=$VERSIONCODE" >> $GITHUB_OUTPUT

        echo "### 📦 Version Code Generated" >> $GITHUB_STEP_SUMMARY
        echo "\`Version Code: $VERSIONCODE\`" >> $GITHUB_STEP_SUMMARY

    - name: Set VERSIONCODE in repo variable
      run: |
        curl -s -L \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -X PUT \
          -d '{"name": "VERSIONCODE", "value": "${{ steps.compute.outputs.VERSIONCODE }}"}' \
          https://api.github.com/repos/${{ github.repository }}/actions/variables/VERSIONCODE
